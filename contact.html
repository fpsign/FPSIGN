<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | FPSIGN</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#08101f;
    color:white;
    font-family:Poppins,sans-serif;
    text-align:center;
    padding:100px 20px;
}

h1{
    color:#0c5c54;
    margin-bottom:40px;
}

.contact-links{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.contact-btn{
    text-decoration:none;
    color:white;
    background:#13203a;
    padding:15px 30px;
    border-radius:50px;
    font-size:18px;
    transition:.3s;
}

.contact-btn:hover{
    background:#0c5c54;
}

.contact-btn i{
    margin-right:10px;
}

</style>
</head>
<body>

<h1>Contact Me</h1>

<div class="contact-links">

    <!-- WhatsApp -->
    <a href="https://wa.me/917593873945"
       target="_blank"
       class="contact-btn">
       <i class="fab fa-whatsapp"></i>
       WhatsApp
    </a>

    <!-- Instagram -->
    <a href="https://instagram.com/fp__sign"
       target="_blank"
       class="contact-btn">
       <i class="fab fa-instagram"></i>
       Instagram
    </a>

</div>

</body>
</html>
